<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>토모리 — 단어 카드 (FE 수직 슬라이스)</title>
  <style>
    /* 폰트 로컬 번들 (사양서 3.1.1 · 3.2.1) — public/fonts/ */
    @font-face{font-family:"Pretendard";src:url("/fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:"Pretendard";src:url("/fonts/Pretendard-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
    @font-face{font-family:"Pretendard";src:url("/fonts/Pretendard-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:"Pretendard";src:url("/fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
    @font-face{font-family:"Noto Sans JP";src:url("/fonts/NotoSansJP-400.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:"Noto Sans JP";src:url("/fonts/NotoSansJP-600.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:"Zen Maru Gothic";src:url("/fonts/ZenMaruGothic-400.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:"Zen Maru Gothic";src:url("/fonts/ZenMaruGothic-700.woff2") format("woff2");font-weight:700;font-display:swap}
    html,body,#root{height:100%}
    body{margin:0;background:#EFE9E1}
    /* squared-paper-texture — RN Web은 mixBlendMode 스타일을 무시하므로 CSS로 직접 overlay 블렌드 */
    [style*="paper.png"]{ mix-blend-mode:overlay; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
